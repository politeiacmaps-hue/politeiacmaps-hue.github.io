<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politeia CMAPS: Inteligencia para la Acción y la Defensa de Activos</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* Variables de Diseño (Basado en la identidad de Politeia + Score) */
        :root {
            --color-azul-fuerte: #01306C; 
            --color-azul-header: #0c3469; 
            --color-rojo-impacto: #E30000; 
            --color-naranja-cta: #FF6600; 
            --color-fondo-claro: #f8f8f8; 
            --color-texto-principal: #222;
            --color-dorado-kpi: #FFD700;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: var(--color-texto-principal);
            background-color: white;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* HEADER (AZUL DE IMPACTO) */
        header {
            background-color: var(--color-azul-header); 
            color: white;
            padding: 50px 0;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 3.2em;
            margin: 0;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.1;
        }
        
        header p {
            font-size: 1.8em;
            font-weight: 300;
            margin-top: 15px;
            color: #ccc;
        }
        
        /* SECCIÓN CLAVE: SCORE CMAPS y RIGOR */
        .seccion-rigor {
            background-color: var(--color-azul-fuerte);
            padding: 60px 0;
            color: white;
            text-align: center;
        }
        
        .seccion-rigor h2 {
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 900;
            font-size: 2.8em;
            margin-top: 0;
            color: white;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        /* Bloque de dos columnas para texto e imagen (KPI) */
        .bloque-kpi {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
            margin-bottom: 70px;
            padding: 30px;
            border: 1px solid var(--color-dorado-kpi);
            border-radius: 8px;
            background-color: rgba(0, 0, 0, 0.1);
        }

        .kpi-texto {
            flex-basis: 55%;
            text-align: left;
        }

        .kpi-imagen {
            flex-basis: 40%;
            text-align: center;
        }

        .kpi-imagen img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            border: 4px solid var(--color-dorado-kpi); 
        }

        .kpi-texto h3 {
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 900;
            font-size: 2.2em;
            margin-top: 0;
            color: var(--color-dorado-kpi); 
        }
        
        .kpi-texto p {
            font-size: 1.15em;
            margin-bottom: 20px;
        }
        
        .kpi-texto strong {
            color: var(--color-naranja-cta);
        }
        
        /* Bloque de colaboración y alcance */
        .bloque-alcance {
            background-color: white;
            color: var(--color-texto-principal);
            padding: 30px;
            border-radius: 8px;
            text-align: left;
            margin-top: 50px;
            border-left: 6px solid var(--color-rojo-impacto);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .bloque-alcance h4 {
            color: var(--color-azul-fuerte);
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 1.8em;
            margin-top: 0;
            font-weight: 900;
        }
        
        .bloque-alcance ul {
            list-style: disc;
            padding-left: 20px;
            font-size: 1.1em;
        }
        
        .bloque-alcance li strong {
            color: var(--color-rojo-impacto);
        }

        /* SECCIÓN DEL MAPA (LA PRUEBA) */
        .seccion-mapas {
            background-color: var(--color-fondo-claro);
            padding: 60px 0;
            text-align: center;
        }
        
        .seccion-mapas h2 {
            color: var(--color-azul-fuerte);
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2.6em;
            margin-bottom: 10px;
            text-transform: uppercase;
            font-weight: 900;
        }
        
        .map-intro-text {
            max-width: 900px;
            margin: 0 auto 30px auto;
            font-size: 1.2em;
            font-weight: 400;
            color: var(--color-texto-principal);
        }
        
        .map-intro-text strong {
            color: var(--color-rojo-impacto);
            font-weight: 700;
        }
        
        /* Contenedor de Tabs */
        .mapa-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 3px solid var(--color-azul-fuerte);
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap; 
        }
        
        .mapa-tab-btn {
            font-family: 'Roboto Condensed', sans-serif;
            background: none;
            border: none;
