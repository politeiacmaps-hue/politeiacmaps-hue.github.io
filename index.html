<html lang="es">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politeia CMAPS: Inteligencia Territorial Ciudadana | La Prueba Innegable</title>

    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-azul-fuerte: #01306C; 
            --color-azul-header: #0c3469; /* COLOR ACTUALIZADO: Azul más claro y vibrante */
            --color-rojo-impacto: #E30000; 
            --color-naranja-cta: #FF6600; 
            --color-fondo-claro: #f8f8f8; 
            --color-texto-principal: #222;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            color: var(--color-texto-principal);
            background-color: white;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* HEADER (AZUL DE IMPACTO: #2f7eab) */
        header {
            background-color: var(--color-azul-header); 
            color: white;
            padding: 40px 0;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 3em;
            margin: 5px 0;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        header p {
            font-size: 1.6em;
            font-weight: 300;
            margin-top: 5px;
            color: #ccc;
        }

        .logo {
            content: url("logo_fondo_azul.jpg"); 
            max-height: 90px;
            display: inline-block;
            margin-bottom: 25px;
        }
        
        /* SECCIÓN VALOR Y EXPERIENCIA */
        .seccion-trayectoria {
            background-color: white;
            padding: 60px 0 40px 0;
            text-align: center;
        }

        .seccion-trayectoria h2 {
            color: var(--color-azul-fuerte);
            font-family: 'Roboto Condensed', sans-serif;
            font-size: 2.6em;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: 900;
        }
        
        /* BLOQUE DE EXPERIENCIA */
        .bloque-experiencia {
            background-color: var(--color-fondo-claro);
            border-radius: 8px;
            padding: 30px;
            margin: 40px auto 50px auto;
            max-width: 900px;
            text-align: left;
            border-left: 6px solid var(--color-naranja-cta);
        }

        .bloque-experiencia h3 {
            /* Título modificado para sonar más impactante */
            color: var(--color-azul-fuerte);
            font-size: 1.8em;
            margin-top: 0;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
        }

        .bloque-experiencia p {
            font-size: 1.1em;
        }
        
        /* ITEMS DE VALOR */
        .valor-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: space-between;
            gap: 30px;
            margin-top: 40px;
        }

        .valor-item {
            flex-basis: 30%;
            min-width: 250px;
            padding: 25px;
            border-bottom: 5px solid var(--color-rojo-impacto);
            background-color: var(--color-fondo-claro);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            text-align: left; 
        }
        
        /* REGLA CLAVE: CENTRAR LA TERCERA CAJA (EL EMPRENDEDOR) */
        .valor-item:nth-child(3) {
            flex-basis: 100%; 
            width: 30%; 
            margin: 0 auto; 
            text-align: center; 
            margin-top: 30px; 
        }
        
        .valor-item h4 {
            font-family: 'Roboto Condensed', sans-serif;
            color: var(--color-azul-fuerte);
            font-size: 1.5em;
            margin-top: 0;
            font-weight: 900;
        }
        
        /* NUEVOS ESTILOS PARA SCORE CMAPS Y RIGOR */
        .seccion-rigor {
            background-color: var(--color-azul-fuerte);
            padding: 50px 0;
            color: white;
            text-align: center;
        }

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            margin-bottom: 50px;
        }
